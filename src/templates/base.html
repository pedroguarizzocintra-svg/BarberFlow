<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}BarberFlow{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('index') }}">Barber<span>Flow</span></a>
{% if g.user %}<form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary">Sair</button></form>{% endif %}</header>
<main>{% for category,message in get_flashed_messages(with_categories=true) %}<p role="status" class="notice {{ category }}">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}</main>
<footer>BarberFlow · Projeto acadêmico</footer></body></html>
